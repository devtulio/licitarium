name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: testes
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --clean Licitarium.spec
      - name: Anexar exe à release
        run: gh release upload ${{ github.ref_name }} dist/Licitarium.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
