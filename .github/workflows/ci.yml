name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install chromium
      # screenshots.spec.js fica de fora: regrava docs/screenshots/*.png,
      # que são versionados e regerados à mão quando a interface muda
      - run: npx playwright test tests-e2e/app.spec.js tests-e2e/manual.spec.js

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: testes
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --clean Licitarium.spec
      - name: Anexar exe à release
        # o nome do exe carrega a versão ("Licitarium v1.2.4.exe"), então o
        # caminho vem por glob; falha explicitamente se não gerou exatamente um
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem dist/*.exe)
          if ($exe.Count -ne 1) { throw "esperava 1 exe em dist/, achei $($exe.Count)" }
          gh release upload ${{ github.ref_name }} $exe[0].FullName
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
